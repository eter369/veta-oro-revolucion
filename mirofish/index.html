<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07080b" />
    <meta name="color-scheme" content="dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>MIROFISH × TESLA 369 — Terminal Probabilístico · KIPU</title>
    <style>
      /* roca desde el primer pintado, antes de que cargue el bundle */
      html,body{background:#07080b;color:#edeae3}
      /* vuelta al escritorio, como en el resto de la dimensión */
      .kipu-volver{position:fixed;left:12px;bottom:12px;z-index:9999;display:inline-block;
        font:600 11px/1 'Inter','Segoe UI',sans-serif;letter-spacing:.08em;text-decoration:none;
        color:#edeae3;background:#0f1116;border:1px solid rgba(201,162,39,.55);border-radius:999px;
        padding:9px 15px;transition:background-color .2s ease,color .2s ease,transform .3s ease,opacity .3s ease}
      .kipu-volver:hover{background:#c9a227;color:#07080b}
      .kipu-volver:focus-visible{outline:2px solid #c9a227;outline-offset:3px}
      /* al bajar se aparta para no tapar contenido; vuelve al subir o al final */
      .kipu-volver.is-oculta{transform:translateY(calc(100% + 16px));opacity:0;pointer-events:none}
      .kipu-volver.is-oculta:focus-visible{transform:none;opacity:1}
      @media (prefers-reduced-motion:reduce){.kipu-volver{transition:none}}
    </style>
    <script type="module" crossorigin src="./assets/index-BHyvGbRW.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CGvkll-G.css">
  </head>
  <body>
    <div id="root"></div>
    <a class="kipu-volver" href="../santa-catarina">← Escritorio</a>
    <script>
      (function () {
        var a = document.querySelector('.kipu-volver'), y = scrollY;
        addEventListener('scroll', function () {
          var n = scrollY, alFinal = innerHeight + n >= document.documentElement.scrollHeight - 48;
          if (Math.abs(n - y) < 6) return;
          a.classList.toggle('is-oculta', n > y && n > 160 && !alFinal);
          y = n;
        }, { passive: true });
      })();
    </script>
  </body>
</html>
